<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Colombo Quality Camps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    .contact-section {
      min-height: 100vh;
      padding-top: 120px;
      padding-bottom: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-card {
      background: linear-gradient(109deg, rgba(193, 216, 255, 0.10) 0%, rgba(74, 111, 171, 0.15) 99%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 680px;
    }

    .contact-card h2 {
      background: linear-gradient(139deg, #FFF 0%, #8B8EA1 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 32px;
      margin-bottom: 0.25rem;
    }

    .contact-card .subtitle {
      color: #8B8EA1;
      font-size: 15px;
      margin-bottom: 2rem;
    }

    .contact-card label {
      color: #c5c8d8;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .contact-card .form-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      padding: 0.6rem 0.9rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .contact-card .form-control:focus {
      background: rgba(255, 255, 255, 0.10);
      border-color: #26C67C;
      box-shadow: 0 0 0 3px rgba(38, 198, 124, 0.18);
      color: #fff;
      outline: none;
    }

    .contact-card .form-control::placeholder {
      color: #5a5d6e;
    }

    .contact-card textarea.form-control {
      resize: vertical;
      min-height: 130px;
    }

    .contact-submit-btn {
      --hover: 0;
      position: relative;
      font-size: 15px;
      font-weight: 400;
      width: 100%;
      color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(109deg, rgba(38, 198, 124, 0.20) 0%, rgba(74, 111, 171, 0.20) 100%);
      border-radius: 10px;
      border: 1px solid rgba(38, 198, 124, 0.4);
      padding: 0.65rem 1.5rem;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .contact-submit-btn:hover {
      background: linear-gradient(109deg, rgba(38, 198, 124, 0.35) 0%, rgba(74, 111, 171, 0.30) 100%);
      border-color: #26C67C;
      box-shadow: 0 0 18px rgba(38, 198, 124, 0.25);
      color: #fff;
    }

    .contact-submit-btn:active {
      outline: none;
    }
  </style>
</head>

<body>
  <div class="circle"></div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg fixed-top mx-5 my-3">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-1">
        <img src="cqcpnglogo.svg" alt="logo" height="40" />
        <a class="navbar-brand" href="index.html">Colombo Quality Camp</a>
      </div>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="index.html">About</a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle text-white"
              href="#"
              id="navbarDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Quality Week
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" href="pages/QE24.html">QE Week 2022</a></li>
              <li><a class="dropdown-item" href="pages/QE24.html">QE Week 2022</a></li>
              <li>
                <hr class="dropdown-divider" />
              </li>
              <li><a class="dropdown-item" href="pages/QE24.html">QE Week 2022</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white active" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>

  <!-- Contact Section -->
  <section class="contact-section p-4">
    <div class="contact-card">
      <h2>Contact Us</h2>
      <p class="subtitle">Have a question or want to get in touch? Send us a message and we'll get back to you.</p>

      <form action="https://formsubmit.co/chammarox@gmail.com" method="POST">
        <!-- Disable CAPTCHA page redirect -->
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_subject" value="New Contact Form Submission - CQC Website" />

        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Your full name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="mb-3">
          <label for="subject" class="form-label">Subject</label>
          <input
            type="text"
            class="form-control"
            id="subject"
            name="subject"
            placeholder="What is this about?"
            required
          />
        </div>

        <div class="mb-4">
          <label for="message" class="form-label">Message</label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            placeholder="Write your message here..."
            required
          ></textarea>
        </div>

        <button type="submit" class="contact-submit-btn">Send Message</button>
      </form>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>

  <footer class="footer bg-dark text-white py-4">
    <div class="container text-center">
      <p>&copy; 2024 Colombo Quality Camp. All Rights Reserved.</p>
      <div class="social-icons">
        <a href="#" class="text-white me-3"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
        <a href="#" class="text-white"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>
</body>

<script>
document.addEventListener('mousemove', (e) => {
    const circle = document.querySelector('.circle');
    circle.style.left = `${e.clientX}px`;
    circle.style.top = `${e.clientY}px`;
});
</script>

</html>
