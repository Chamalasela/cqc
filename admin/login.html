<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Colombo Quality Camp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body d-flex align-items-center justify-content-center min-vh-100">

  <div class="admin-login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
        <img src="../cqcpnglogo.svg" alt="CQC Logo" height="38">
        <span class="fw-bold text-white fs-5">Colombo Quality Camp</span>
      </a>
      <h2 class="admin-login-title mt-2">Admin Portal</h2>
      <p class="text-muted small">Sign in to manage website content</p>
    </div>

    <div id="loginError" class="alert alert-danger" role="alert" style="display:none">
      <i class="fas fa-exclamation-circle me-2"></i>Incorrect password. Please try again.
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="adminPassword" class="form-label text-muted small">Password</label>
        <div class="input-group">
          <span class="input-group-text admin-input-icon"><i class="fas fa-lock"></i></span>
          <input
            type="password"
            class="form-control admin-input"
            id="adminPassword"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
          >
          <button
            class="btn admin-toggle-pw"
            type="button"
            id="togglePw"
            aria-label="Show/hide password"
          ><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="btn admin-btn-primary w-100 mt-2" id="loginBtn">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-muted small text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i>Back to website
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', handleLogin);

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
      const pwInput = document.getElementById('adminPassword');
      const icon    = document.querySelector('#togglePw i');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwInput.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>

</body>
</html>
